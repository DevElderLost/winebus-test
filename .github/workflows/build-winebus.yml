name: build-winebus-udev

on:
  workflow_dispatch:
    inputs:
      wine_repo:
        description: "URL git source Wine (antarmuka winebus harus sama dengan Wine di Winlator)"
        required: true
        default: "https://github.com/ValveSoftware/wine.git"
      wine_ref:
        description: "Tag / branch / commit SHA source Wine"
        required: true
        default: "proton_9.0"
      android_api:
        description: "Level API Android target (NDK clang aarch64-linux-androidNN)"
        required: true
        default: "28"
      sdl_soname:
        description: "Nama file SDL2 yang di-dlopen di Winlator (samakan dengan winebus.so asli)"
        required: true
        default: "libSDL2-2.0.so"
      runpath:
        description: "RUNPATH winebus.so (samakan dengan winebus.so asli)"
        required: true
        default: "/data/data/com.winlator.cmod/files/imagefs/usr/lib"
      sdl_ref:
        description: "Tag SDL2 untuk header (hanya header, SDL tidak ikut ter-link)"
        required: true
        default: "release-2.30.9"
      udev_ref:
        description: "Tag libudev-zero (di-link statis ke winebus.so)"
        required: true
        default: "1.0.3"
      build_setupapi:
        description: "Ikut build setupapi.dll + cfgmgr32.dll (patch CM_Get_Device_Interface_List) agar HIDAPI SDL3 melihat hidraw"
        required: true
        type: boolean
        default: true
      setupapi_archs:
        description: "--enable-archs untuk build PE (samakan dengan Wine di Winlator; arm64ec butuh llvm-mingw)"
        required: true
        default: "arm64ec,aarch64,i386"
      llvm_mingw_tag:
        description: "Rilis llvm-mingw (mstorsjo/llvm-mingw) untuk kompiler PE"
        required: true
        default: "20241030"

jobs:
  build:
    # NDK resmi hanya untuk host x86_64; hasilnya tetap binary aarch64 (cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cari Android NDK bawaan runner
        id: ndk
        run: |
          for v in ANDROID_NDK_LATEST_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            d="${!v:-}"
            if [ -n "$d" ] && [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "NDK ditemukan: $d"
              exit 0
            fi
          done
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "NDK bawaan tidak ada, pasang lewat setup-ndk"

      - name: Pasang NDK (cadangan)
        id: setup_ndk
        if: steps.ndk.outputs.dir == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build winebus.so (NDK, bionic)
        env:
          WINE_REPO: ${{ inputs.wine_repo }}
          WINE_REF: ${{ inputs.wine_ref }}
          ANDROID_API: ${{ inputs.android_api }}
          SDL_SONAME: ${{ inputs.sdl_soname }}
          WINEBUS_RUNPATH: ${{ inputs.runpath }}
          SDL_REF: ${{ inputs.sdl_ref }}
          UDEV_REF: ${{ inputs.udev_ref }}
          ANDROID_NDK_DIR: ${{ steps.ndk.outputs.dir || steps.setup_ndk.outputs.ndk-path }}
        run: python3 scripts/build_winebus_ndk.py --out out --work work

      - name: Verifikasi hasil
        run: python3 scripts/verify_winebus_ndk.py out/winebus.so

      - uses: actions/upload-artifact@v4
        with:
          name: winebus-udev-aarch64-bionic
          path: out/*

  setupapi:
    if: ${{ inputs.build_setupapi }}
    # host aarch64 agar configure Wine arm64ec berjalan natif; hasil PE (setupapi.dll) tidak bergantung host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi build Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex gettext pkg-config make git xz-utils ca-certificates python3 autoconf

      - name: Pasang llvm-mingw (aarch64 host)
        run: |
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${{ inputs.llvm_mingw_tag }}/llvm-mingw-${{ inputs.llvm_mingw_tag }}-ucrt-ubuntu-20.04-aarch64.tar.xz"
          curl -fsSL "$url" -o llvm-mingw.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Ambil source Wine (repo/ref yang sama dengan winebus)
        run: |
          git init wine-src
          cd wine-src
          git remote add origin "${{ inputs.wine_repo }}"
          git fetch --depth 1 origin "${{ inputs.wine_ref }}"
          git checkout --detach FETCH_HEAD
          echo "WINE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Patch setupapi (CM_Get_Device_Interface_List)
        run: python3 scripts/patch_setupapi_cfgmgr.py wine-src

      - name: Configure Wine
        run: |
          set -eo pipefail
          # repo Wine (mis. Valve) tidak menyimpan ./configure hasil generate: buat dulu
          if [ ! -x wine-src/configure ]; then
            # autogen.sh (Valve) = make_requests + make_vulkan + make_specfiles + autoreconf; fork lain: autoreconf saja
            (cd wine-src && if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi)
          fi
          test -x wine-src/configure
          # file Vulkan hasil generate (include/wine/vulkan.h, vulkan-1.spec, dst.) tidak disimpan di repo Valve
          if [ ! -f wine-src/include/wine/vulkan.h ] && [ -f wine-src/dlls/winevulkan/make_vulkan ]; then
            (cd wine-src/dlls/winevulkan && python3 make_vulkan -x vk.xml)
          fi
          mkdir -p wine-build
          cd wine-build
          ../wine-src/configure --enable-archs="${{ inputs.setupapi_archs }}" --with-mingw=clang \
            --disable-tests --disable-win16 --without-x --without-freetype --without-alsa --without-pulse \
            --without-oss --without-gstreamer --without-sdl --without-udev --without-usb --without-v4l2 \
            --without-wayland --without-vulkan --without-cups --without-sane --without-gphoto --without-pcap \
            2>&1 | tee configure.log

      - name: Build setupapi.dll dan cfgmgr32.dll
        working-directory: wine-build
        run: |
          set -eo pipefail
          make -j"$(nproc)" dlls/setupapi/all dlls/cfgmgr32/all || make -j"$(nproc)"

      - name: Kumpulkan hasil
        run: |
          mkdir -p out-setupapi
          cd wine-build
          find dlls/setupapi dlls/cfgmgr32 \( -name setupapi.dll -o -name cfgmgr32.dll \) -type f | while read -r f; do
            d="../out-setupapi/$(basename "$(dirname "$f")")"
            mkdir -p "$d"
            cp "$f" "$d/"
          done
          cd ..
          {
            echo "wine_repo=${{ inputs.wine_repo }}"
            echo "wine_ref=${{ inputs.wine_ref }}"
            echo "wine_commit=$WINE_COMMIT"
            echo "archs=${{ inputs.setupapi_archs }}"
            echo "llvm_mingw=${{ inputs.llvm_mingw_tag }}"
            (cd out-setupapi && find . -type f -exec sha256sum {} \;)
          } > out-setupapi/BUILDINFO.txt
          cat out-setupapi/BUILDINFO.txt
          test -n "$(find out-setupapi -name setupapi.dll)" || { echo "setupapi.dll tidak terbentuk"; exit 1; }

      - name: Verifikasi ekspor CM_Get_Device_Interface_List*
        run: |
          for f in $(find out-setupapi -name setupapi.dll); do
            n=$(llvm-objdump -p "$f" | grep -c "CM_Get_Device_Interface_List")
            echo "$f: $n ekspor CM_Get_Device_Interface_List*"
            test "$n" -ge 8
          done

      - uses: actions/upload-artifact@v4
        with:
          name: setupapi-pe
          path: out-setupapi/*

  bundle:
    needs: [build, setupapi]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - uses: actions/upload-artifact@v4
        with:
          name: winebus-setupapi-bundle
          path: bundle/*
