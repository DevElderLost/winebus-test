name: build-winebus-udev

on:
  workflow_dispatch:
    inputs:
      wine_repo:
        description: "URL git source Wine (antarmuka winebus harus sama dengan Wine di Winlator)"
        required: true
        default: "https://github.com/ValveSoftware/wine.git"
      wine_ref:
        description: "Tag / branch / commit SHA source Wine"
        required: true
        default: "proton_9.0"
      android_api:
        description: "Level API Android target (NDK clang aarch64-linux-androidNN)"
        required: true
        default: "28"
      sdl_soname:
        description: "Nama file SDL2 yang di-dlopen di Winlator (samakan dengan winebus.so asli)"
        required: true
        default: "libSDL2-2.0.so"
      runpath:
        description: "RUNPATH winebus.so (samakan dengan winebus.so asli)"
        required: true
        default: "/data/data/com.winlator.cmod/files/imagefs/usr/lib"
      sdl_ref:
        description: "Tag SDL2 untuk header (hanya header, SDL tidak ikut ter-link)"
        required: true
        default: "release-2.30.9"
      udev_ref:
        description: "Tag libudev-zero (di-link statis ke winebus.so)"
        required: true
        default: "1.0.3"
      build_setupapi:
        description: "Ikut build setupapi.dll + cfgmgr32.dll (patch CM_Get_Device_Interface_List) agar HIDAPI SDL3 melihat hidraw"
        required: true
        type: boolean
        default: true
      hidclass_queue:
        description: "Ikut build hidclass.sys yang dipatch: antrean input Steam Deck (VID 28DE) diperkecil dari 32 ke 4 report agar SDL HIDAPI tidak membaca report berumur ~125 ms (delay input hidraw)"
        required: true
        type: boolean
        default: true
      setupapi_archs:
        description: "--enable-archs untuk build PE (samakan dengan Wine di Winlator; arm64ec butuh llvm-mingw)"
        required: true
        default: "arm64ec,aarch64,i386"
      llvm_mingw_tag:
        description: "Rilis llvm-mingw (mstorsjo/llvm-mingw) untuk kompiler PE. arm64ec WAJIB LLVM >= 20 (20250305 = LLVM 20.1.0): lld 19.x tidak me-resolve import lib/winecrt0 ARM64EC (undefined symbol: DllMainCRTStartup, __imp_*)"
        required: true
        default: "20250305"

jobs:
  build:
    # NDK resmi hanya untuk host x86_64; hasilnya tetap binary aarch64 (cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cari Android NDK bawaan runner
        id: ndk
        run: |
          for v in ANDROID_NDK_LATEST_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            d="${!v:-}"
            if [ -n "$d" ] && [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "NDK ditemukan: $d"
              exit 0
            fi
          done
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "NDK bawaan tidak ada, pasang lewat setup-ndk"

      - name: Pasang NDK (cadangan)
        id: setup_ndk
        if: steps.ndk.outputs.dir == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build winebus.so (NDK, bionic)
        env:
          WINE_REPO: ${{ inputs.wine_repo }}
          WINE_REF: ${{ inputs.wine_ref }}
          ANDROID_API: ${{ inputs.android_api }}
          SDL_SONAME: ${{ inputs.sdl_soname }}
          WINEBUS_RUNPATH: ${{ inputs.runpath }}
          SDL_REF: ${{ inputs.sdl_ref }}
          UDEV_REF: ${{ inputs.udev_ref }}
          ANDROID_NDK_DIR: ${{ steps.ndk.outputs.dir || steps.setup_ndk.outputs.ndk-path }}
        run: python3 scripts/build_winebus_ndk.py --out out --work work

      - name: Verifikasi hasil
        run: python3 scripts/verify_winebus_ndk.py out/winebus.so

      - uses: actions/upload-artifact@v4
        with:
          name: winebus-udev-aarch64-bionic
          path: out/*

  setupapi:
    if: ${{ inputs.build_setupapi }}
    # host aarch64 agar configure Wine arm64ec berjalan natif; hasil PE (setupapi.dll) tidak bergantung host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi build Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex gettext pkg-config make git xz-utils ca-certificates python3 autoconf

      - name: Pasang llvm-mingw (aarch64 host)
        run: |
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${{ inputs.llvm_mingw_tag }}/llvm-mingw-${{ inputs.llvm_mingw_tag }}-ucrt-ubuntu-20.04-aarch64.tar.xz"
          curl -fsSL "$url" -o llvm-mingw.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
          # winebuild --staticlib memanggil `ar`. lld-link WAJIB punya EC symbol map (/<ECSYMBOLS>/) di arsip ARM64EC;
          # tanpanya seluruh isi libwinecrt0.a / import lib diabaikan (DllMainCRTStartup, __wine_stub_* "undefined").
          # llvm-ar di Linux default-nya format GNU (tanpa EC map), jadi paksa --format=coff khusus arsip target Windows.
          mkdir -p "$HOME/ar-shim"
          # pakai --format=coff hanya bila llvm-ar mendukungnya (LLVM lama tidak punya opsi ini)
          if "$HOME/llvm-mingw/bin/llvm-ar" --help 2>&1 | grep -q "coff"; then COFF="--format=coff"; else COFF=""; fi
          cat > "$HOME/ar-shim/ar" <<EOF
          #!/bin/sh
          case "\$*" in
            *-windows/*) exec "$HOME/llvm-mingw/bin/llvm-ar" $COFF "\$@" ;;
            *) exec "$HOME/llvm-mingw/bin/llvm-ar" "\$@" ;;
          esac
          EOF
          chmod +x "$HOME/ar-shim/ar"
          ln -sf "$HOME/llvm-mingw/bin/llvm-ranlib" "$HOME/ar-shim/ranlib"
          echo "$HOME/ar-shim" >> "$GITHUB_PATH"
          # arm64ec dengan LLVM < 20 gagal di tahap link (lld 19 tidak menemukan simbol di arsip ARM64EC) dan hasilnya hanya
          # arm64 biasa (aarch64-windows). Gagal lebih awal daripada diam-diam menghasilkan DLL arsitektur yang salah.
          major=$("$HOME/llvm-mingw/bin/clang" --version | sed -n 's/.*clang version \([0-9]*\)\..*/\1/p' | head -1)
          echo "clang llvm-mingw: major=$major"
          case "${{ inputs.setupapi_archs }}" in
            *arm64ec*) test "${major:-0}" -ge 20 || { echo "::error::arm64ec butuh llvm-mingw dengan LLVM >= 20 (dapat: ${major:-?}). Pakai llvm_mingw_tag >= 20250305."; exit 1; } ;;
          esac

      - name: Ambil source Wine (repo/ref yang sama dengan winebus)
        run: |
          git init wine-src
          cd wine-src
          git remote add origin "${{ inputs.wine_repo }}"
          git fetch --depth 1 origin "${{ inputs.wine_ref }}"
          git checkout --detach FETCH_HEAD
          echo "WINE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Patch setupapi (CM_Get_Device_Interface_List)
        run: |
          # lld 19 menolak stub ARM64EC buatan winebuild Wine 9.0 (__wine_stub_* / #__wine_spec_unimplemented_stub undefined):
          # untuk arm64ec semua "@ stub" diganti fungsi nyata yang dikompilasi clang
          flag=""
          case "${{ inputs.setupapi_archs }}" in *arm64ec*) flag="--convert-stubs" ;; esac
          python3 scripts/patch_setupapi_cfgmgr.py wine-src $flag

      - name: Patch hidclass.sys (antrean input perangkat Valve)
        if: ${{ inputs.hidclass_queue }}
        run: python3 scripts/patch_hidclass_queue.py wine-src

      - name: Configure Wine
        run: |
          set -eo pipefail
          # repo Wine (mis. Valve) tidak menyimpan ./configure hasil generate: buat dulu
          if [ ! -x wine-src/configure ]; then
            # autogen.sh (Valve) = make_requests + make_vulkan + make_specfiles + autoreconf; fork lain: autoreconf saja
            (cd wine-src && if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi)
          fi
          test -x wine-src/configure
          # Probe configure memakai `-Wl,-WX` (peringatan linker = error). lld dari LLVM 20 mengeluarkan peringatan khusus ARM64EC
          # pada program uji kosong, sehingga deteksi kompiler gagal ("MinGW arm64ec compiler not found") padahal toolchain-nya
          # sehat. -WX hanya pengetat, jadi dibuang dari configure.ac dan configure hasil generate.
          sed -i 's/[ ]*-Wl,-WX//g' wine-src/configure.ac wine-src/configure
          # file Vulkan hasil generate (include/wine/vulkan.h, vulkan-1.spec, dst.) tidak disimpan di repo Valve
          if [ ! -f wine-src/include/wine/vulkan.h ] && [ -f wine-src/dlls/winevulkan/make_vulkan ]; then
            (cd wine-src/dlls/winevulkan && python3 make_vulkan -x vk.xml)
          fi
          mkdir -p wine-build
          cd wine-build
          conf_args=(--enable-archs="${{ inputs.setupapi_archs }}" --with-mingw=clang
            --disable-tests --disable-win16 --without-x --without-freetype --without-alsa --without-pulse
            --without-oss --without-gstreamer --without-sdl --without-udev --without-usb --without-v4l2
            --without-wayland --without-vulkan --without-cups --without-sane --without-gphoto --without-pcap)
          if ! ../wine-src/configure "${conf_args[@]}" 2>&1 | tee configure.log; then
            # tampilkan galat asli probe kompiler PE (config.log tidak ikut ke log langkah)
            echo "::group::config.log - probe kompiler PE arm64ec"
            grep -n -B2 -A20 -- '-target arm64ec-windows' config.log | head -200 || true
            echo "::endgroup::"
            # fallback: probe arm64ec yang gagal dipaksa lolos. Kalau toolchain benar-benar rusak, galatnya muncul jelas
            # di langkah build berikutnya, dan verifikasi arsitektur PE di akhir tetap menolak DLL yang salah.
            forced=$(sed -n -E "s/^(ac_cv_[A-Za-z0-9_]*arm64ec[A-Za-z0-9_]*subsystem[A-Za-z0-9_]*)=['\"]?no['\"]?$/\1/p" config.log | sort -u)
            test -n "$forced" || { echo "::error::probe kompiler PE gagal dan bukan probe arm64ec; lihat config.log di atas"; exit 1; }
            echo "::warning::probe kompiler arm64ec dipaksa lolos: $forced"
            env_args=()
            for v in $forced; do env_args+=("$v=yes"); done
            rm -f config.status config.log
            env "${env_args[@]}" ../wine-src/configure "${conf_args[@]}" 2>&1 | tee configure.log
          fi

      - name: Build wine tools (winebuild, winegcc, wrc)
        working-directory: wine-build
        run: make -j"$(nproc)" tools

      # cfgmgr32.dll hanya berisi spec (stub + forward), tanpa source C. Link-nya butuh libwinecrt0.a
      # (DllMainCRTStartup, __wine_spec_unimplemented_stub) dan import lib ntdll untuk SEMUA arsitektur PE.
      # Target `dlls/cfgmgr32/all` sendiri tidak menarik dependensi itu, jadi tanpa langkah ini lld-link gagal:
      #   undefined symbol: DllMainCRTStartup / #__wine_spec_unimplemented_stub / __wine_stub_CM_*
      - name: Build runtime PE (winecrt0 + import lib dasar)
        working-directory: wine-build
        run: |
          set -eo pipefail
          # lokasi winecrt0 beda antar versi Wine (libs/ atau dlls/), jadi ambil target .a langsung dari Makefile hasil configure
          targets=$(grep -oE '^(dlls|libs)/(winecrt0|ntdll|kernel32|kernelbase)/[A-Za-z0-9_-]+-windows/[A-Za-z0-9_.]+\.a:' Makefile | tr -d ':' | sort -u)
          echo "$targets"
          echo "$targets" | grep -q winecrt0 || { echo "target libwinecrt0.a tidak ditemukan di Makefile"; exit 1; }
          make -j"$(nproc)" $targets
          echo "ar yang dipakai: $(command -v ar) -> $(readlink -f "$(command -v ar)")"
          llvm-nm --print-armap dlls/winecrt0/arm64ec-windows/libwinecrt0.a | grep -E "DllMainCRTStartup|__delayLoadHelper2" || true
          if grep -qa "ECSYMBOLS" dlls/winecrt0/arm64ec-windows/libwinecrt0.a; then echo "EC symbol map: ada"; else echo "EC symbol map: tidak ada (lld lama memakai armap biasa)"; fi
          clang --version | head -1
          # diagnostik: di mana __wine_spec_unimplemented_stub didefinisikan (nama polos vs berawalan #) pada tiap arsip
          for a in arm64ec aarch64 i386; do
            echo "== $a: libwinecrt0.a"
            llvm-nm --print-armap "dlls/winecrt0/$a-windows/libwinecrt0.a" 2>&1 | grep -E "unimplemented|ECSYMBOLS|EC map" || echo "(tidak ada baris cocok)"
            llvm-nm -A --defined-only "dlls/winecrt0/$a-windows/libwinecrt0.a" 2>&1 | grep -E "stub\.o" || true
          done
          llvm-ar --version | head -2
          llvm-ar t dlls/winecrt0/arm64ec-windows/libwinecrt0.a | head -30

      - name: Build setupapi.dll dan cfgmgr32.dll
        working-directory: wine-build
        run: |
          set -eo pipefail
          # Build per arsitektur: kegagalan satu arsitektur (mis. arm64ec) tidak menutupi hasil arsitektur lain.
          # setupapi dulu (cfgmgr32 meneruskan ekspor ke setupapi), lalu cfgmgr32.
          failed=""
          for arch in $(echo "${{ inputs.setupapi_archs }}" | tr ',' ' '); do
            echo "::group::Build $arch"
            if make -j"$(nproc)" "dlls/setupapi/$arch-windows/setupapi.dll" \
               && make -j"$(nproc)" "dlls/cfgmgr32/$arch-windows/cfgmgr32.dll" \
               && { [ "${{ inputs.hidclass_queue }}" != "true" ] || make -j"$(nproc)" "dlls/hidclass.sys/$arch-windows/hidclass.sys"; }; then
              echo "== $arch: OK"
            else
              echo "== $arch: GAGAL"
              echo "::warning::build PE $arch gagal (lihat grup 'Build $arch'); arsitektur lain tetap diproses"
              failed="$failed $arch"
            fi
            echo "::endgroup::"
          done
          echo "SETUPAPI_FAILED=${failed# }" >> "$GITHUB_ENV"
          test -n "$(find dlls/setupapi -name setupapi.dll)" || { echo "tidak ada arsitektur yang berhasil dibuild"; exit 1; }
          # Arsitektur yang gagal TIDAK boleh lolos diam-diam: hasil parsial (mis. hanya aarch64) mudah salah dipasang
          # sebagai ARM64EC. Job tetap gagal; langkah kumpul/upload di bawah tetap jalan agar log/artefak parsial bisa diperiksa.
          if [ -n "$failed" ]; then echo "::error::build PE gagal untuk:$failed"; exit 1; fi

      # DLL asli Wine/Winlator di aarch64-windows berformat ARM64X (ARM64 + ARM64EC + thunk X64 dalam satu file,
      # Machine 0xA64E). Wine hanya membuat aarch64-windows (ARM64 murni) dan arm64ec-windows (ARM64EC murni) terpisah,
      # jadi keduanya ditautkan ulang dengan lld-link /machine:arm64x supaya formatnya sama dengan file asli.
      - name: Tautkan ARM64X (format sama dengan DLL asli)
        if: ${{ !cancelled() && contains(inputs.setupapi_archs, 'arm64ec') && contains(inputs.setupapi_archs, 'aarch64') }}
        working-directory: wine-build
        run: |
          set -eo pipefail
          for dll in setupapi cfgmgr32; do
            python3 ../scripts/link_arm64x.py --dll "$dll" --build-dir . --out "../arm64x-out/aarch64-windows/$dll.dll"
          done
          if [ "${{ inputs.hidclass_queue }}" = "true" ]; then
            python3 ../scripts/link_arm64x.py --dll hidclass --moddir hidclass.sys --ext sys --build-dir . --out "../arm64x-out/aarch64-windows/hidclass.sys"
          fi

      - name: Kumpulkan hasil
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out-setupapi
          cd wine-build
          find dlls/setupapi dlls/cfgmgr32 dlls/hidclass.sys \( -name setupapi.dll -o -name cfgmgr32.dll -o -name hidclass.sys \) -type f | while read -r f; do
            d="../out-setupapi/$(basename "$(dirname "$f")")"
            # bila ARM64X berhasil dibuat, DLL mentah aarch64 (ARM64 murni) dan arm64ec (ARM64EC murni) tidak ikut dipaket
            if [ -d ../arm64x-out/aarch64-windows ]; then
              case "$(basename "$(dirname "$f")")" in aarch64-windows|arm64ec-windows) continue ;; esac
            fi
            mkdir -p "$d"
            cp "$f" "$d/"
          done
          cd ..
          if [ -d arm64x-out/aarch64-windows ]; then mkdir -p out-setupapi/aarch64-windows && cp arm64x-out/aarch64-windows/* out-setupapi/aarch64-windows/; fi
          {
            echo "wine_repo=${{ inputs.wine_repo }}"
            echo "wine_ref=${{ inputs.wine_ref }}"
            echo "wine_commit=$WINE_COMMIT"
            echo "archs=${{ inputs.setupapi_archs }}"
            echo "llvm_mingw=${{ inputs.llvm_mingw_tag }}"
            echo "arsitektur_gagal=${SETUPAPI_FAILED:-tidak ada}"
            (cd out-setupapi && find . -type f -exec sha256sum {} \;)
          } > out-setupapi/BUILDINFO.txt
          cat out-setupapi/BUILDINFO.txt
          test -n "$(find out-setupapi -name setupapi.dll)" || { echo "setupapi.dll tidak terbentuk"; exit 1; }

      - name: Verifikasi ekspor CM_Get_Device_Interface_List*
        if: ${{ !cancelled() }}
        run: |
          for f in $(find out-setupapi -name setupapi.dll); do
            n=$(llvm-objdump -p "$f" | grep -c "CM_Get_Device_Interface_List")
            echo "$f: $n ekspor CM_Get_Device_Interface_List*"
            test "$n" -ge 8
          done

      # Pastikan format tiap DLL sama dengan DLL asli Wine: aarch64-windows = ARM64X (CodeMap ARM64 + ARM64EC + X64),
      # i386-windows = x86. ARM64 murni (0xAA64) atau ARM64EC murni di aarch64-windows dianggap SALAH.
      - name: Verifikasi format PE (ARM64X seperti file asli)
        if: ${{ !cancelled() }}
        run: |
          set -eo pipefail
          bad=0
          for f in $(find out-setupapi \( -name '*.dll' -o -name '*.sys' \) | sort); do
            dir=$(basename "$(dirname "$f")")
            m=$(llvm-readobj --file-headers "$f" | sed -n 's/.*Machine: \(IMAGE_FILE_MACHINE_[A-Z0-9_]*\).*/\1/p' | head -1)
            case "$dir" in
              aarch64-windows) want=IMAGE_FILE_MACHINE_ARM64X ;;
              arm64ec-windows) want=IMAGE_FILE_MACHINE_ARM64EC ;;
              i386-windows)    want=IMAGE_FILE_MACHINE_I386 ;;
              *) want="" ;;
            esac
            if [ -n "$want" ] && [ "$m" != "$want" ]; then echo "SALAH  $f: $m (harusnya $want)"; bad=1; else echo "OK     $f: $m"; fi
            if [ "$dir" = aarch64-windows ]; then
              cm=$(llvm-readobj --coff-load-config "$f" | sed -n '/CodeMap \[/,/\]/p' | head -8)
              for k in ARM64 ARM64EC X64; do echo "$cm" | grep -qE "[0-9A-Fa-f] +$k\$" || { echo "SALAH  $f: CodeMap tanpa $k"; bad=1; }; done
            fi
          done
          case "${{ inputs.setupapi_archs }}" in
            *arm64ec*) test -f out-setupapi/aarch64-windows/setupapi.dll || { echo "::error::aarch64-windows/setupapi.dll (ARM64X) tidak ada"; bad=1; } ;;
          esac
          exit $bad

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: setupapi-pe
          path: out-setupapi/*

  bundle:
    needs: [build, setupapi]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.setupapi.result == 'success' || needs.setupapi.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - uses: actions/upload-artifact@v4
        with:
          name: winebus-setupapi-bundle
          path: bundle/*
